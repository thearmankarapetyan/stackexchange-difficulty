name: Project verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Repository checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Python ${{ matrix.python-version }} setup
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dependency installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Python source compilation
        run: python -m compileall -q src

      - name: Ruff source check
        run: python -m ruff check src

      - name: Markdown documentation check
        if: matrix.python-version == '3.12'
        run: >-
          npx --yes markdownlint-cli2@0.23.0
          '**/*.md' '.github/**/*.md'

      - name: Command-line interface check
        run: |
          python src/extract_threads.py --help
          python src/extract_request_summary.py --help
          python src/build_characteristics.py --help
          python src/build_data_dictionary.py --help

      - name: Bundled XML pilot reconstruction
        if: matrix.python-version == '3.12'
        run: |
          python src/build_characteristics.py \
            --dump-dir data/examples/pilot_dump \
            --site softwareengineering.stackexchange.com \
            --dump-date 2026-04-20 \
            --start-date 2024-01-01 \
            --end-date 2024-12-31 \
            --limit 20 \
            --output-dir /tmp/stackexchange-pilot
          cmp \
            /tmp/stackexchange-pilot/thread_characteristics.tsv \
            data/examples/characteristics_pilot.tsv
          cmp \
            /tmp/stackexchange-pilot/validation.tsv \
            data/examples/characteristics_pilot_validation.tsv
          python src/build_data_dictionary.py --check

      - name: Bundled pilot notebook execution
        if: matrix.python-version == '3.12'
        run: |
          python -m nbconvert \
            --to notebook \
            --execute notebooks/stackexchange_eda.ipynb \
            --output-dir /tmp \
            --output stackexchange_eda.executed.ipynb \
            --ExecutePreprocessor.timeout=600
