name: Verify project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall -q src

      - name: Run Ruff
        run: python -m ruff check src

      - name: Check command-line interfaces
        run: |
          python src/extract_threads.py --help
          python src/extract_request_summary.py --help
          python src/build_characteristics.py --help

      - name: Execute the bundled pilot notebook
        if: matrix.python-version == '3.12'
        run: |
          python -m nbconvert \
            --to notebook \
            --execute notebooks/stackexchange_eda.ipynb \
            --output-dir /tmp \
            --output stackexchange_eda.executed.ipynb \
            --ExecutePreprocessor.timeout=600
