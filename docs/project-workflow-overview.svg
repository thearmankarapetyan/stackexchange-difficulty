<svg xmlns="http://www.w3.org/2000/svg" width="4800" height="3400" viewBox="0 0 4800 3400" role="img" aria-labelledby="title description">
<title id="title">From Stack Exchange access to verified project results</title>
<desc id="description">Step-by-step flowchart for accessing a Stack Exchange data dump and using the three implemented project routes.</desc>
<defs>
      <marker id="arrow" markerWidth="18" markerHeight="18" refX="13" refY="6"
              orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,12 L15,6 z" fill="#35506b"/>
      </marker>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17324d"
                      flood-opacity="0.16"/>
      </filter>
      <style>
        text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #18324b; }
        .phase { font-size: 48px; font-weight: 700; fill: white; }
        .box-title { font-size: 42px; font-weight: 700; }
        .box-body { font-size: 36px; font-weight: 400; font-style: normal; }
        .route-title { font-size: 42px; font-weight: 700; fill: white; }
        .small { font-size: 34px; font-style: normal; }
        .arrow { stroke: #35506b; stroke-width: 11; fill: none;
                 marker-end: url(#arrow); stroke-linecap: round;
                 stroke-linejoin: round; }
      </style>
    </defs>
<rect width="4800" height="3400" fill="#f5f8fb"/>
<rect x="70" y="55" width="4660" height="82" rx="24" fill="#315f85"/>
<text x="130" y="111" text-anchor="start" class="phase">
<tspan x="130" dy="0">1</tspan>
</text>
<text x="285" y="111" text-anchor="start" class="phase">
<tspan x="285" dy="0">Access the selected Stack Exchange community data</tspan>
</text>
<rect x="110" y="180" width="1070" height="250" rx="28" fill="#ffffff" stroke="#8ba6bd" stroke-width="6" filter="url(#shadow)"/>
<text x="645" y="236" text-anchor="middle" class="box-title">
<tspan x="645" dy="0">Choose a community</tspan>
</text>
<text x="645" y="285" text-anchor="middle" class="box-body">
<tspan x="645" dy="0">Select the compatible Stack Exchange</tspan>
<tspan x="645" dy="46">community whose data will be analysed.</tspan>
</text>
<rect x="1280" y="180" width="1070" height="250" rx="28" fill="#ffffff" stroke="#8ba6bd" stroke-width="6" filter="url(#shadow)"/>
<text x="1815" y="236" text-anchor="middle" class="box-title">
<tspan x="1815" dy="0">Sign in</tspan>
</text>
<text x="1815" y="285" text-anchor="middle" class="box-body">
<tspan x="1815" dy="0">Create an account on that community</tspan>
<tspan x="1815" dy="46">or sign in with an existing account.</tspan>
</text>
<rect x="2450" y="180" width="1070" height="250" rx="28" fill="#ffffff" stroke="#8ba6bd" stroke-width="6" filter="url(#shadow)"/>
<text x="2985" y="236" text-anchor="middle" class="box-title">
<tspan x="2985" dy="0">Open dump access</tspan>
</text>
<text x="2985" y="285" text-anchor="middle" class="box-body">
<tspan x="2985" dy="0">Open the profile, then Settings, then Access,</tspan>
<tspan x="2985" dy="46">and select Data dump access.</tspan>
</text>
<rect x="3620" y="180" width="1070" height="250" rx="28" fill="#ffffff" stroke="#8ba6bd" stroke-width="6" filter="url(#shadow)"/>
<text x="4155" y="236" text-anchor="middle" class="box-title">
<tspan x="4155" dy="0">Download the dump</tspan>
</text>
<text x="4155" y="285" text-anchor="middle" class="box-body">
<tspan x="4155" dy="0">Review the permitted-use declaration</tspan>
<tspan x="4155" dy="46">and start the current dump download.</tspan>
</text>
<path class="arrow" d="M1180,305 L1265,305"/>
<polygon points="1241,287 1241,323 1271,305" fill="#35506b"/>
<path class="arrow" d="M2350,305 L2435,305"/>
<polygon points="2411,287 2411,323 2441,305" fill="#35506b"/>
<path class="arrow" d="M3520,305 L3605,305"/>
<polygon points="3581,287 3581,323 3611,305" fill="#35506b"/>
<rect x="70" y="500" width="4660" height="82" rx="24" fill="#467994"/>
<text x="130" y="556" text-anchor="start" class="phase">
<tspan x="130" dy="0">2</tspan>
</text>
<text x="285" y="556" text-anchor="start" class="phase">
<tspan x="285" dy="0">Prepare the local inputs and project environment</tspan>
</text>
<rect x="170" y="625" width="1360" height="285" rx="28" fill="#ffffff" stroke="#8ba6bd" stroke-width="6" filter="url(#shadow)"/>
<text x="850" y="681" text-anchor="middle" class="box-title">
<tspan x="850" dy="0">Extract the downloaded archive</tspan>
</text>
<text x="850" y="730" text-anchor="middle" class="box-body">
<tspan x="850" dy="0">Use a source-data folder selected</tspan>
<tspan x="850" dy="46">for the current run.</tspan>
</text>
<rect x="1720" y="625" width="1360" height="285" rx="28" fill="#ffffff" stroke="#8ba6bd" stroke-width="6" filter="url(#shadow)"/>
<text x="2400" y="681" text-anchor="middle" class="box-title">
<tspan x="2400" dy="0">Confirm the required XML files</tspan>
</text>
<text x="2400" y="730" text-anchor="middle" class="box-body">
<tspan x="2400" dy="0">Posts.xml and Comments.xml support</tspan>
<tspan x="2400" dy="46">Routes A and B. Route C also uses Votes.xml.</tspan>
</text>
<rect x="3270" y="625" width="1360" height="285" rx="28" fill="#ffffff" stroke="#8ba6bd" stroke-width="6" filter="url(#shadow)"/>
<text x="3950" y="681" text-anchor="middle" class="box-title">
<tspan x="3950" dy="0">Prepare the project</tspan>
</text>
<text x="3950" y="730" text-anchor="middle" class="box-body">
<tspan x="3950" dy="0">Use Python 3.10 or newer, install</tspan>
<tspan x="3950" dy="46">requirements.txt, and open the project root.</tspan>
</text>
<path class="arrow" d="M1530,768 L1705,768"/>
<polygon points="1681,750 1681,786 1711,768" fill="#35506b"/>
<path class="arrow" d="M3080,768 L3255,768"/>
<polygon points="3231,750 3231,786 3261,768" fill="#35506b"/>
<rect x="70" y="980" width="4660" height="82" rx="24" fill="#2d6f66"/>
<text x="130" y="1036" text-anchor="start" class="phase">
<tspan x="130" dy="0">3</tspan>
</text>
<text x="285" y="1036" text-anchor="start" class="phase">
<tspan x="285" dy="0">Choose and run one or more implemented result routes</tspan>
</text>
<path d="M2400,1110 L2820,1285 L2400,1460 L1980,1285 Z" fill="#fff4cc" stroke="#b88900" stroke-width="7" filter="url(#shadow)"/>
<text x="2400" y="1269" text-anchor="middle" class="box-title">
<tspan x="2400" dy="0">Which result</tspan>
<tspan x="2400" dy="43">is needed?</tspan>
</text>
<path class="arrow" d="M2400,910 L2400,1095"/>
<polygon points="2382,1071 2418,1071 2400,1101" fill="#35506b"/>
<path class="arrow" d="M2200,1438 L830,1438 L830,1510 L830,1560"/>
<polygon points="812,1536 848,1536 830,1566" fill="#35506b"/>
<path class="arrow" d="M2400,1460 L2400,1560"/>
<polygon points="2382,1536 2418,1536 2400,1566" fill="#35506b"/>
<path class="arrow" d="M2600,1438 L3970,1438 L3970,1510 L3970,1560"/>
<polygon points="3952,1536 3988,1536 3970,1566" fill="#35506b"/>
<rect x="70" y="1580" width="1460" height="1160" rx="34" fill="#ffffff" stroke="#3e73a8" stroke-width="8" filter="url(#shadow)"/>
<rect x="70" y="1580" width="1460" height="105" rx="30" fill="#3e73a8"/>
<rect x="70" y="1645" width="1460" height="40" fill="#3e73a8"/>
<text x="800" y="1649" text-anchor="middle" class="route-title">
<tspan x="800" dy="0">Route A — Complete thread XML</tspan>
</text>
<rect x="125" y="1725" width="1350" height="205" rx="28" fill="#eef5fb" stroke="#6e9bc5" stroke-width="6" filter="url(#shadow)"/>
<text x="800" y="1781" text-anchor="middle" class="box-title">
<tspan x="800" dy="0">Select the question posts</tspan>
</text>
<text x="800" y="1830" text-anchor="middle" class="box-body">
<tspan x="800" dy="0">Choose one or more question post IDs</tspan>
<tspan x="800" dy="46">from the selected community.</tspan>
</text>
<rect x="125" y="1965" width="1350" height="235" rx="28" fill="#ffffff" stroke="#6e9bc5" stroke-width="6" filter="url(#shadow)"/>
<text x="800" y="2021" text-anchor="middle" class="box-title">
<tspan x="800" dy="0">Run the complete-thread extractor</tspan>
</text>
<text x="800" y="2070" text-anchor="middle" class="box-body">
<tspan x="800" dy="0">src/extract_threads.py</tspan>
<tspan x="800" dy="46">Provide the source-data folder, output XML,</tspan>
<tspan x="800" dy="46">and selected question IDs.</tspan>
</text>
<rect x="125" y="2235" width="1350" height="260" rx="28" fill="#eaf7ed" stroke="#5a9a67" stroke-width="6" filter="url(#shadow)"/>
<text x="800" y="2291" text-anchor="middle" class="box-title">
<tspan x="800" dy="0">Result</tspan>
</text>
<text x="800" y="2340" text-anchor="middle" class="box-body">
<tspan x="800" dy="0">One XML file. Each thread contains the</tspan>
<tspan x="800" dy="46">question source attributes, direct question</tspan>
<tspan x="800" dy="46">comments, and all available answers.</tspan>
</text>
<rect x="125" y="2510" width="1350" height="180" rx="28" fill="#fff8e1" stroke="#c79b2d" stroke-width="6" filter="url(#shadow)"/>
<text x="800" y="2566" text-anchor="middle" class="box-title">
<tspan x="800" dy="0">Completion check</tspan>
</text>
<text x="800" y="2615" text-anchor="middle" class="box-body">
<tspan x="800" dy="0">Requested unique IDs are present;</tspan>
<tspan x="800" dy="46">comments and answers are chronological.</tspan>
</text>
<path class="arrow" d="M800,1930 L800,1950"/>
<polygon points="782,1926 818,1926 800,1956" fill="#35506b"/>
<path class="arrow" d="M800,2200 L800,2220"/>
<polygon points="782,2196 818,2196 800,2226" fill="#35506b"/>
<path class="arrow" d="M800,2495 L800,2500"/>
<polygon points="782,2476 818,2476 800,2506" fill="#35506b"/>
<rect x="1670" y="1580" width="1460" height="1160" rx="34" fill="#ffffff" stroke="#7b5ba7" stroke-width="8" filter="url(#shadow)"/>
<rect x="1670" y="1580" width="1460" height="105" rx="30" fill="#7b5ba7"/>
<rect x="1670" y="1645" width="1460" height="40" fill="#7b5ba7"/>
<text x="2400" y="1649" text-anchor="middle" class="route-title">
<tspan x="2400" dy="0">Route B — Configurable summary XML</tspan>
</text>
<rect x="1725" y="1725" width="1350" height="205" rx="28" fill="#f5f0fa" stroke="#9a7bbb" stroke-width="6" filter="url(#shadow)"/>
<text x="2400" y="1781" text-anchor="middle" class="box-title">
<tspan x="2400" dy="0">Select questions and fields</tspan>
</text>
<text x="2400" y="1830" text-anchor="middle" class="box-body">
<tspan x="2400" dy="0">Choose question post IDs and use</tspan>
<tspan x="2400" dy="46">config/summary_fields.tsv or a copied selection.</tspan>
</text>
<rect x="1725" y="1965" width="1350" height="235" rx="28" fill="#ffffff" stroke="#9a7bbb" stroke-width="6" filter="url(#shadow)"/>
<text x="2400" y="2021" text-anchor="middle" class="box-title">
<tspan x="2400" dy="0">Run the summary extractor</tspan>
</text>
<text x="2400" y="2070" text-anchor="middle" class="box-body">
<tspan x="2400" dy="0">src/extract_request_summary.py</tspan>
<tspan x="2400" dy="46">Provide the source-data folder, output XML,</tspan>
<tspan x="2400" dy="46">IDs, and field selection when customized.</tspan>
</text>
<rect x="1725" y="2235" width="1350" height="260" rx="28" fill="#eaf7ed" stroke="#5a9a67" stroke-width="6" filter="url(#shadow)"/>
<text x="2400" y="2291" text-anchor="middle" class="box-title">
<tspan x="2400" dy="0">Result</tspan>
</text>
<text x="2400" y="2340" text-anchor="middle" class="box-body">
<tspan x="2400" dy="0">One XML file with one request per question.</tspan>
<tspan x="2400" dy="46">Selected fields follow the configured order;</tspan>
<tspan x="2400" dy="46">unavailable source values create empty elements.</tspan>
</text>
<rect x="1725" y="2510" width="1350" height="180" rx="28" fill="#fff8e1" stroke="#c79b2d" stroke-width="6" filter="url(#shadow)"/>
<text x="2400" y="2566" text-anchor="middle" class="box-title">
<tspan x="2400" dy="0">Completion check</tspan>
</text>
<text x="2400" y="2615" text-anchor="middle" class="box-body">
<tspan x="2400" dy="0">Question IDs, field names, and field order</tspan>
<tspan x="2400" dy="46">match the selected configuration.</tspan>
</text>
<path class="arrow" d="M2400,1930 L2400,1950"/>
<polygon points="2382,1926 2418,1926 2400,1956" fill="#35506b"/>
<path class="arrow" d="M2400,2200 L2400,2220"/>
<polygon points="2382,2196 2418,2196 2400,2226" fill="#35506b"/>
<path class="arrow" d="M2400,2495 L2400,2500"/>
<polygon points="2382,2476 2418,2476 2400,2506" fill="#35506b"/>
<rect x="3270" y="1580" width="1460" height="1160" rx="34" fill="#ffffff" stroke="#b05f35" stroke-width="8" filter="url(#shadow)"/>
<rect x="3270" y="1580" width="1460" height="105" rx="30" fill="#b05f35"/>
<rect x="3270" y="1645" width="1460" height="40" fill="#b05f35"/>
<text x="4000" y="1649" text-anchor="middle" class="route-title">
<tspan x="4000" dy="0">Route C — Characteristics and EDA</tspan>
</text>
<rect x="3325" y="1725" width="1350" height="225" rx="28" fill="#fbf1eb" stroke="#c47c54" stroke-width="6" filter="url(#shadow)"/>
<text x="4000" y="1781" text-anchor="middle" class="box-title">
<tspan x="4000" dy="0">Select the analysis settings</tspan>
</text>
<text x="4000" y="1830" text-anchor="middle" class="box-body">
<tspan x="4000" dy="0">Choose community host, dump snapshot date,</tspan>
<tspan x="4000" dy="46">question period, and output folder.</tspan>
<tspan x="4000" dy="46">A row limit and schema are optional.</tspan>
</text>
<rect x="3325" y="1985" width="1350" height="220" rx="28" fill="#ffffff" stroke="#c47c54" stroke-width="6" filter="url(#shadow)"/>
<text x="4000" y="2041" text-anchor="middle" class="box-title">
<tspan x="4000" dy="0">Build the characteristic table</tspan>
</text>
<text x="4000" y="2090" text-anchor="middle" class="box-body">
<tspan x="4000" dy="0">src/build_characteristics.py</tspan>
<tspan x="4000" dy="46">The builder reads Posts.xml, Comments.xml,</tspan>
<tspan x="4000" dy="46">Votes.xml, and the characteristic schema.</tspan>
</text>
<rect x="3325" y="2240" width="1350" height="215" rx="28" fill="#eaf7ed" stroke="#5a9a67" stroke-width="6" filter="url(#shadow)"/>
<text x="4000" y="2296" text-anchor="middle" class="box-title">
<tspan x="4000" dy="0">Generated files</tspan>
</text>
<text x="4000" y="2345" text-anchor="middle" class="box-body">
<tspan x="4000" dy="0">thread_characteristics.tsv</tspan>
<tspan x="4000" dy="46">validation.tsv</tspan>
<tspan x="4000" dy="46">run_metadata.json</tspan>
</text>
<rect x="3325" y="2480" width="1350" height="220" rx="28" fill="#fff8e1" stroke="#c79b2d" stroke-width="6" filter="url(#shadow)"/>
<text x="4000" y="2536" text-anchor="middle" class="box-title">
<tspan x="4000" dy="0">Validate and analyse</tspan>
</text>
<text x="4000" y="2585" text-anchor="middle" class="box-body">
<tspan x="4000" dy="0">Confirm no FAIL, review WARN, check metadata.</tspan>
<tspan x="4000" dy="46">Open notebooks/stackexchange_eda.ipynb, set DATA_FILE,</tspan>
<tspan x="4000" dy="46">and run every cell from a clean kernel.</tspan>
</text>
<path class="arrow" d="M4000,1950 L4000,1970"/>
<polygon points="3982,1946 4018,1946 4000,1976" fill="#35506b"/>
<path class="arrow" d="M4000,2205 L4000,2225"/>
<polygon points="3982,2201 4018,2201 4000,2231" fill="#35506b"/>
<path class="arrow" d="M4000,2455 L4000,2470"/>
<polygon points="3982,2446 4018,2446 4000,2476" fill="#35506b"/>
<rect x="70" y="2810" width="4660" height="82" rx="24" fill="#35506b"/>
<text x="130" y="2866" text-anchor="start" class="phase">
<tspan x="130" dy="0">4</tspan>
</text>
<text x="285" y="2866" text-anchor="start" class="phase">
<tspan x="285" dy="0">Verify the result and keep the evidence needed to reproduce it</tspan>
</text>
<rect x="165" y="2940" width="1420" height="290" rx="28" fill="#eaf7ed" stroke="#5a9a67" stroke-width="6" filter="url(#shadow)"/>
<text x="875" y="2996" text-anchor="middle" class="box-title">
<tspan x="875" dy="0">Successful XML routes</tspan>
</text>
<text x="875" y="3045" text-anchor="middle" class="box-body">
<tspan x="875" dy="0">The XML opens, requested question IDs are</tspan>
<tspan x="875" dy="46">present, and its contents match the selected</tspan>
<tspan x="875" dy="46">route and summary field configuration.</tspan>
</text>
<rect x="1690" y="2940" width="1420" height="290" rx="28" fill="#eaf7ed" stroke="#5a9a67" stroke-width="6" filter="url(#shadow)"/>
<text x="2400" y="2996" text-anchor="middle" class="box-title">
<tspan x="2400" dy="0">Successful characteristic route</tspan>
</text>
<text x="2400" y="3045" text-anchor="middle" class="box-body">
<tspan x="2400" dy="0">Validation contains no FAIL, metadata matches</tspan>
<tspan x="2400" dy="46">the run settings, and the notebook completes</tspan>
<tspan x="2400" dy="46">with readable tables, figures, and interpretations.</tspan>
</text>
<rect x="3215" y="2940" width="1420" height="290" rx="28" fill="#fff0ef" stroke="#ba5b55" stroke-width="6" filter="url(#shadow)"/>
<text x="3925" y="2996" text-anchor="middle" class="box-title">
<tspan x="3925" dy="0">When a check fails</tspan>
</text>
<text x="3925" y="3045" text-anchor="middle" class="box-body">
<tspan x="3925" dy="0">Correct the community, input files, question IDs,</tspan>
<tspan x="3925" dy="46">field selection, dates, or output location, then</tspan>
<tspan x="3925" dy="46">run the affected route again.</tspan>
</text>
<text x="2400" y="3340" text-anchor="middle" class="small">
<tspan x="2400" dy="0">Source dump files are read without modification. Input and output locations are selected for each run.</tspan>
</text>
</svg>